name: Тесты

on:
  push:
    branches: [main]
  pull_request:

# Тестам нужен только код: токену с правом записи здесь делать нечего.
permissions:
  contents: read

# Новый push в ветку отменяет прогон предыдущего коммита — кроме main,
# откуда по зелёным тестам запускается выкат.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Прогнать тесты
        run: python -m pytest -q
