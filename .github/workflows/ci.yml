name: Тесты

on:
  push:
    branches: [main]
  pull_request:

# Тестам нужен только код: токену с правом записи здесь делать нечего.
permissions:
  contents: read

# Новый push в ветку отменяет прогон предыдущего коммита — кроме main,
# откуда по зелёным тестам запускается выкат.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      # Одна упавшая версия не должна отменять прогон остальных: иначе
      # неясно, сломано везде или только на ней.
      fail-fast: false
      matrix:
        # 3.12 — то, на чём бот реально работает (python:3.12-slim в
        # Dockerfile). 3.14 — то, что стоит на машине разработчика. 3.13
        # между ними: начиная с неё audioop выехал из стандартной
        # библиотеки, и discord.py тянет его отдельным audioop-lts.
        python-version: ["3.12", "3.13", "3.14"]
    name: Тесты (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Прогнать тесты
        run: python -m pytest -q
